name: Publish coupon

# Sweeps the public leynos estate against every concordat rule, renders the
# coupon and deploys it to GitHub Pages. The sweep fetches each repository with
# git (no per-file REST reads), so the Actions token's REST budget is spent only
# on pin and Whitaker-certification lookups.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # GitHub-hosted on purpose: the estate's Ubicloud runners are for hot-path
    # jobs, and a public repository's hosted minutes are free.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # makeutil v0.1.2's x86_64 musl release asset and its SHA-256 digest.
      # Bump the version and the digest together.
      MAKEUTIL_VERSION: "0.1.2"
      MAKEUTIL_ASSET: "makeutil-x86_64-unknown-linux-musl"
      MAKEUTIL_SHA256: "688c3385ac2f5cb630e8a0ffe640815f366793195d35e89821b918b09531adf8"
      # Every run sweeps with concordat's main, not the commit pinned for
      # tests: `make` installs this ref over the locked environment, and an
      # unreachable or broken main fails the run rather than reusing the pin.
      CONCORDAT_REF: main
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      # A repository-scoped token cannot see private repositories, so their
      # count (never their names) is configured as a repository variable.
      PRIVATE_REPOSITORY_COUNT: ${{ vars.PRIVATE_REPOSITORY_COUNT }}
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          persist-credentials: false

      - name: Set up Go for Conftest
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.x'
          cache: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install the policy engine and Makefile parser
        # Concordat's rule packages shell out to both. makeutil is verified
        # against the digest pinned above, not the release's own checksum file.
        run: |
          set -euo pipefail
          go install github.com/open-policy-agent/conftest@v0.52.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          mkdir -p "$HOME/.local/bin"
          url="https://github.com/leynos/makeutil/releases/download/v${MAKEUTIL_VERSION}/${MAKEUTIL_ASSET}"
          curl --fail --silent --show-error --location "$url" --output "$HOME/.local/bin/makeutil"
          echo "${MAKEUTIL_SHA256}  $HOME/.local/bin/makeutil" | sha256sum --check
          chmod +x "$HOME/.local/bin/makeutil"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore the action-pin cache
        # A pin's answer (this SHA names that tag) never changes, so a warm
        # cache removes most of the sweep's REST calls after the first run.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .work/pins
          key: pins-${{ github.run_id }}
          restore-keys: pins-

      - name: Note the REST budget before the sweep
        run: |
          remaining=$(gh api rate_limit --jq .resources.core.remaining)
          echo "REST remaining before: ${remaining}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Sweep and render
        # An empty LOCAL_ROOT fetches every repository from GitHub.
        run: |
          set -euo pipefail
          args="--workers 4"
          if [ -n "${PRIVATE_REPOSITORY_COUNT:-}" ]; then
            args="$args --hidden-private ${PRIVATE_REPOSITORY_COUNT}"
          fi
          make site LOCAL_ROOT= SWEEP_ARGS="$args"

      - name: Note the REST budget after the sweep
        run: |
          remaining=$(gh api rate_limit --jq .resources.core.remaining)
          echo "REST remaining after: ${remaining}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Record the concordat commit swept
        # The coupon footer carries the same commit; the summary makes it
        # visible without opening the page.
        run: |
          set -euo pipefail
          uv run --no-sync concordat-dashboard concordat | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
